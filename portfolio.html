<style>
@charset "UTF-8";
/* ==========================================================================
   김지수 · 게임 기획자 포트폴리오
   Style : "Phantom" (lavender · aubergine) · Pretendard · light/dark
   ========================================================================== */

/* --------------------------------------------------------------------------
   1. Tokens
   -------------------------------------------------------------------------- */
:root {
  /* Phantom palette */
  --aubergine: #3c315b;
  --ghost-lavender: #e2dffe;
  --periwinkle: #ab9ff2;
  --cornflower: #4a87f2;
  --buttercream: #ffffc4;
  --blush: #ffdadc;
  --mint: #2ec08b;
  --paper: #fdfcfe;
  --obsidian: #1c1c1c;
  --fog: #86848d;
  --ash: #e9e8ea;
  --bone: #f4f2f4;

  /* Semantic — LIGHT (default) */
  --bg:          #fdfcfe;
  --bg-elev:     #f4f2f4;
  --surface:     #fdfcfe;
  --surface-2:   #f4f2f4;
  --border:      #e6e4e7;
  --border-2:    #d8d6dc;
  --text:        #1c1c1c;
  --text-muted:  #6a6675;
  --heading:     #3c315b;
  --accent:      #6c5ce0;        /* '정면' 강조 (밝은 배경용 진한 보라) */
  --accent-soft: #ab9ff2;
  --cta:         #e2dffe;
  --cta-text:    #3c315b;
  --cta-hover:   #ab9ff2;
  --ghost-c:     #ab9ff2;
  --glow:        rgb(226 223 254);

  --font-sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
    system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  --font-mono: 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace;

  --tracking: -0.025em;

  --text-caption: 13px;
  --text-body-sm: 15px;
  --text-body: 16px;
  --text-subheading: clamp(17px, 1.2vw + 14px, 20px);
  --text-heading-sm: clamp(19px, 1.6vw + 15px, 24px);
  --text-heading: clamp(23px, 2.6vw + 16px, 30px);
  --text-heading-lg: clamp(30px, 5vw + 12px, 56px);
  --text-display: clamp(40px, 7vw + 12px, 96px);

  --gutter: 20px;
  --section-pad-y: 64px;
  --card-pad: 24px;
  --page-max: 1200px;

  --radius-card: 24px;
  --radius-pill: 100px;
  --radius-lg: 32px;

  --shadow-sm: var(--glow) 0 0 4px 0;
  --shadow-card: 0 1px 2px rgba(28,28,28,.04), 0 8px 24px rgba(60,49,91,.06);

  --nav-h: 60px;
  color-scheme: light;
}

@media (min-width: 768px) { :root { --gutter: 32px; --section-pad-y: 96px; --card-pad: 32px; } }
@media (min-width: 1080px){ :root { --gutter: 40px; --section-pad-y: 120px; --card-pad: 40px; } }

/* Semantic — DARK */
:root[data-theme="dark"] {
  --bg:          #16121f;
  --bg-elev:     #1f1a2b;
  --surface:     #221c30;
  --surface-2:   #2a2340;
  --border:      #37304c;
  --border-2:    #4a4266;
  --text:        #ece9f5;
  --text-muted:  #9a94ac;
  --heading:     #e2dffe;
  --accent:      #c3b8ff;
  --accent-soft: #ab9ff2;
  --cta:         #ab9ff2;
  --cta-text:    #16121f;
  --cta-hover:   #c3b8ff;
  --ghost-c:     #ab9ff2;
  --glow:        rgb(120 104 200 / .5);
  --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

/* --------------------------------------------------------------------------
   2. Reset & base
   -------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--nav-h) + 24px);
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-weight: 400;
  font-size: var(--text-body);
  line-height: 1.6;
  letter-spacing: var(--tracking);
  word-break: keep-all;
  overflow-wrap: break-word;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
  transition: background-color .3s ease, color .3s ease;
}
body.is-locked { overflow: hidden; }

h1, h2, h3, h4, p, figure, blockquote, ul, ol, dl, dd { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3, h4 { font-weight: 350; letter-spacing: var(--tracking); color: var(--heading); }
a { color: inherit; text-decoration: none; }
img, svg { display: block; max-width: 100%; }
button { font: inherit; letter-spacing: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-appearance: none; appearance: none; }
::selection { background: var(--ghost-lavender); color: var(--aubergine); }
:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 3px; border-radius: 4px; }

.skip-link {
  position: absolute; left: 16px; top: -100px; z-index: 200;
  padding: 12px 24px; border-radius: var(--radius-pill);
  background: var(--cta); color: var(--cta-text); font-size: var(--text-body-sm);
  transition: top .2s ease;
}
.skip-link:focus { top: calc(env(safe-area-inset-top, 0px) + 16px); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

/* --------------------------------------------------------------------------
   3. Layout primitives
   -------------------------------------------------------------------------- */
.wrap {
  width: 100%; max-width: var(--page-max); margin-inline: auto;
  padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px));
}
.section { padding-block: var(--section-pad-y); }
.section--elev { background: var(--bg-elev); }

.section__head { max-width: 46rem; margin-bottom: var(--spacing-48, 48px); }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; margin-bottom: 16px;
  padding: 6px 14px; border-radius: var(--radius-pill);
  background: var(--cta); color: var(--cta-text);
  font-size: var(--text-caption); line-height: 1.35; letter-spacing: .02em; white-space: nowrap;
}
.eyebrow__num { opacity: .55; font-variant-numeric: tabular-nums; }
.section__title { font-size: var(--text-heading-lg); line-height: 1.14; letter-spacing: -0.03em; text-wrap: balance; }
.section__lead { margin-top: 20px; max-width: 42rem; font-size: var(--text-subheading); line-height: 1.55; color: var(--text-muted); }
.muted { color: var(--text-muted); }

.grid { display: grid; gap: 16px; }
@media (min-width: 700px)  { .grid--2 { grid-template-columns: repeat(2, 1fr); } .grid--3 { grid-template-columns: repeat(2, 1fr); } .grid { gap: 24px; } }
@media (min-width: 1000px) { .grid--3 { grid-template-columns: repeat(3, 1fr); } }

/* --------------------------------------------------------------------------
   4. Buttons, tags, badges
   -------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 14px 28px;
  border: 1px solid transparent; border-radius: var(--radius-pill);
  font-size: var(--text-body); font-weight: 350; line-height: 1.2; letter-spacing: var(--tracking);
  transition: transform .18s ease, background-color .18s ease, border-color .18s ease, color .18s ease, box-shadow .18s ease;
  touch-action: manipulation;
}
.btn:active { transform: scale(.97); }
.btn--primary { background: var(--cta); color: var(--cta-text); box-shadow: var(--shadow-sm); }
.btn--primary:hover { background: var(--cta-hover); }
.btn--outline { border-color: var(--border-2); color: var(--heading); background: var(--surface); }
.btn--outline:hover { border-color: var(--accent-soft); }
.btn--sm { min-height: 40px; padding: 10px 20px; font-size: var(--text-body-sm); }
.btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }

.link-more {
  display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px;
  border-radius: var(--radius-pill); background: var(--cta); color: var(--cta-text);
  font-size: var(--text-body-sm); line-height: 1.2; transition: background-color .18s ease, transform .18s ease;
}
.link-more:hover { background: var(--cta-hover); }
.link-more:active { transform: scale(.97); }
.link-more .arrow { transition: transform .18s ease; }
.link-more:hover .arrow { transform: translate(2px, -2px); }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  display: inline-block; padding: 6px 14px; border: 1px solid var(--border);
  border-radius: var(--radius-pill); background: var(--surface);
  font-size: var(--text-caption); line-height: 1.35; color: var(--heading);
}
.tag--lavender   { background: var(--ghost-lavender); border-color: transparent; color: var(--aubergine); }
.tag--butter     { background: var(--buttercream); border-color: transparent; color: var(--obsidian); }
.tag--blush      { background: var(--blush); border-color: transparent; color: var(--obsidian); }
.tag--cornflower { background: var(--cornflower); border-color: transparent; color: var(--paper); }

.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px;
  border-radius: var(--radius-pill); background: var(--mint); color: #fff;
  font-size: var(--text-caption); line-height: 1.35;
}
.badge__dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

/* --------------------------------------------------------------------------
   5. Ghost mascot
   -------------------------------------------------------------------------- */
.ghost { display: inline-block; width: .78em; height: .86em; color: var(--ghost-c); vertical-align: -.08em; flex: none; }
.ghost--float { animation: bob 3.6s ease-in-out infinite; }
@keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8%)} }

/* 큰 고스트 일러스트 (사진 자리 대체) */
.ghost-art {
  position: relative; width: 100%; max-width: 380px; aspect-ratio: 4 / 5;
  border-radius: var(--radius-card); background: var(--bg-elev);
  border: 1px solid var(--border); display: grid; place-items: center; overflow: hidden;
}
.ghost-art::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(120% 90% at 70% 20%, color-mix(in srgb, var(--periwinkle) 22%, transparent), transparent 60%);
}
.ghost-art .ghost { width: 42%; height: auto; aspect-ratio: 32/36; position: relative; }

/* --------------------------------------------------------------------------
   6. Header (collapsed, cursor-responsive)
   -------------------------------------------------------------------------- */
.nav-wrap {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: center;
  padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
  pointer-events: none;
}
.nav {
  pointer-events: auto;
  display: flex; align-items: center; gap: 12px;
  width: 100%; max-width: var(--page-max);
  padding: 6px 6px 6px 16px;
  border: 1px solid var(--border); border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px);
  transition: max-width .38s cubic-bezier(.2,.8,.3,1), padding .3s ease, box-shadow .3s ease;
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { .nav { background: var(--bg); } }

.nav__logo { display: inline-flex; align-items: center; gap: 8px; padding-right: 8px; min-width: 0; font-size: var(--text-body-sm); color: var(--heading); white-space: nowrap; }
.nav__logo .ghost { width: 22px; height: 24px; }
.nav__logo-en { display: none; color: var(--text-muted); font-size: var(--text-caption); }
@media (min-width: 560px) { .nav__logo-en { display: inline; } }

.nav__menu { display: none; }
@media (min-width: 1000px) {
  .nav__menu { display: flex; align-items: center; gap: 2px; margin-inline: auto; }
  .nav__link { display: inline-flex; align-items: center; gap: 5px; padding: 9px 15px; border-radius: var(--radius-pill); font-size: var(--text-body-sm); color: var(--heading); white-space: nowrap; transition: background-color .18s ease; }
  .nav__link:hover { background: var(--surface-2); }
  .nav__link.is-active { background: var(--cta); color: var(--cta-text); }
  .nav__link .chev { width: 4px; height: 7px; opacity: .5; flex: none; }
}
.nav__actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
@media (min-width: 1000px) { .nav__actions { margin-left: 0; } }

/* 접힘/펼침 — 데스크톱: 좁게 접혀 있다가 hover/focus 시 펼침 */

.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px; border-radius: var(--radius-pill);
  background: var(--surface-2); color: var(--heading); transition: background-color .18s ease;
}
.icon-btn:hover { background: var(--ash); }
:root[data-theme="dark"] .icon-btn:hover { background: var(--border); }

.lang-toggle { display: inline-flex; padding: 3px; border: 1px solid var(--border); border-radius: var(--radius-pill); background: var(--surface-2); }
.lang-toggle__btn { padding: 7px 10px; border-radius: var(--radius-pill); font-size: var(--text-caption); color: var(--text-muted); line-height: 1; transition: background-color .18s ease, color .18s ease; }
.lang-toggle__btn[aria-pressed="true"] { background: var(--aubergine); color: var(--paper); }
:root[data-theme="dark"] .lang-toggle__btn[aria-pressed="true"] { background: var(--periwinkle); color: var(--aubergine); }

.nav__cta { display: none; }
@media (min-width: 620px) { .nav__cta { display: inline-flex; } }

.nav__burger { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: var(--radius-pill); background: var(--surface-2); color: var(--heading); }
@media (min-width: 1000px) { .nav__burger { display: none; } }
.nav__burger-lines { display: block; width: 18px; height: 10px; position: relative; }
.nav__burger-lines::before, .nav__burger-lines::after { content: ''; position: absolute; left: 0; right: 0; height: 1.5px; border-radius: 2px; background: currentColor; transition: transform .24s ease, top .24s ease, bottom .24s ease; }
.nav__burger-lines::before { top: 0; } .nav__burger-lines::after { bottom: 0; }
.nav__burger[aria-expanded="true"] .nav__burger-lines::before { top: 4px; transform: rotate(45deg); }
.nav__burger[aria-expanded="true"] .nav__burger-lines::after { bottom: 4px; transform: rotate(-45deg); }

/* 헤더 펼침 손잡이 (와이어프레임의 중앙 chevron) */
.nav-handle {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + var(--nav-h) + 6px);
  left: 50%; transform: translateX(-50%); z-index: 99;
  display: none; align-items: center; justify-content: center;
  width: 56px; height: 26px; border-radius: 0 0 var(--radius-pill) var(--radius-pill);
  background: var(--surface-2); color: var(--heading); border: 1px solid var(--border); border-top: 0;
  transition: transform .3s ease, opacity .3s ease;
}
/* nav-handle 미사용 */ .nav-handle { display: none !important; }
.nav-handle svg { width: 16px; height: 16px; transition: transform .3s ease; }

/* Mobile sheet */
.sheet {
  position: fixed; inset: 0; z-index: 90; display: flex; flex-direction: column; justify-content: flex-end;
  padding: 12px max(var(--gutter), env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(var(--gutter), env(safe-area-inset-right,0px));
  background: color-mix(in srgb, var(--aubergine) 28%, transparent);
  -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  opacity: 0; visibility: hidden; transition: opacity .24s ease, visibility .24s ease; overscroll-behavior: contain;
}
.sheet.is-open { opacity: 1; visibility: visible; }
.sheet__panel { max-height: calc(100svh - 120px); overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 24px; border-radius: var(--radius-lg); background: var(--surface); transform: translateY(16px); transition: transform .28s cubic-bezier(.2,.8,.3,1); }
.sheet.is-open .sheet__panel { transform: translateY(0); }
.sheet__link { display: flex; align-items: baseline; gap: 12px; padding: 14px 8px; border-bottom: 1px solid var(--border); font-size: var(--text-heading-sm); color: var(--heading); }
.sheet__link:last-of-type { border-bottom: 0; }
.sheet__link.is-active { color: var(--accent); }
.sheet__num { font-size: var(--text-caption); color: var(--accent-soft); font-variant-numeric: tabular-nums; }
.sheet__foot { margin-top: 16px; display: grid; gap: 8px; }
.sheet__foot .btn { width: 100%; }

/* --------------------------------------------------------------------------
   7. Page shell (fixed header offset)
   -------------------------------------------------------------------------- */
main { display: block; padding-top: calc(var(--nav-h) + 24px); }

/* --------------------------------------------------------------------------
   8. HERO (home / resume)
   -------------------------------------------------------------------------- */
.hero {
  min-height: calc(100svh - var(--nav-h) - 24px);
  display: flex; align-items: center; padding-block: 40px 32px;
}
.hero__grid { display: grid; gap: 32px; align-items: center; width: 100%; }
@media (min-width: 900px) { .hero__grid { grid-template-columns: 1.4fr 1fr; gap: 48px; } }

.hero__eyebrow { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 20px; padding: 7px 16px; border: 1px solid var(--border); border-radius: var(--radius-pill); font-size: var(--text-caption); letter-spacing: .04em; color: var(--heading); }
.hero__title { font-size: var(--text-display); line-height: 1.1; letter-spacing: -0.035em; color: var(--heading); text-wrap: balance; }
.hero__title .accent { color: var(--accent); }
.hero__title .name { color: var(--accent); }
.hero__sub { margin-top: 24px; max-width: 34rem; font-size: var(--text-subheading); line-height: 1.6; color: var(--text-muted); }
.hero__media { justify-self: center; }
@media (min-width: 900px) { .hero__media { justify-self: end; } }
.hero__note { margin-top: 40px; display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-caption); color: var(--text-muted); letter-spacing: .04em; }
.hero__note svg { width: 16px; height: 16px; animation: bob 2.4s ease-in-out infinite; }

/* --------------------------------------------------------------------------
   9. HOME — 카드 뽑기
   -------------------------------------------------------------------------- */
/* 홈: 히어로 + 카드 뽑기를 한 화면에 (데스크톱/태블릿) */
[data-page="home"] main { padding-top: calc(var(--nav-h) + 12px); }
.home-screen { display: flex; flex-direction: column; }
@media (min-width: 768px) {
  .home-screen {
    min-height: calc(100svh - var(--nav-h) - 24px);
    justify-content: center;
    gap: clamp(16px, 3vh, 40px);
  }
  .home-screen .hero { min-height: 0; padding-block: 0; }
  .home-screen .draw { padding-block: 0; }
  /* 한 화면에 맞도록 히어로·일러스트·덱 크기 축소 */
  .home-screen .hero__title { font-size: clamp(34px, 3.4vw + 14px, 60px); }
  .home-screen .ghost-art { max-width: min(300px, 30vh); }
  .home-screen .draw__deck { width: clamp(140px, 14vw, 170px); }
}
@media (min-width: 768px) and (max-height: 860px) {
  .home-screen .hero__sub { display: none; }        /* 낮은 화면에선 부제 숨겨 공간 확보 */
  .home-screen .ghost-art { max-width: min(240px, 26vh); }
}
.draw { padding-block: var(--section-pad-y); }
.draw__stage {
  display: flex; align-items: stretch; gap: 16px; flex-wrap: wrap;
}
.draw__deck {
  position: relative; flex: none; width: 180px; aspect-ratio: 3 / 4;
  border: 0; background: none; cursor: pointer; touch-action: manipulation;
}
.draw__deck-card {
  position: absolute; inset: 0; border-radius: var(--radius-card);
  background: var(--aubergine); border: 1px solid var(--aubergine);
  display: grid; place-items: center;
  transition: transform .25s cubic-bezier(.2,.8,.3,1);
}
.draw__deck-card:nth-child(1) { transform: rotate(-6deg) translate(-6px, 4px); opacity: .5; }
.draw__deck-card:nth-child(2) { transform: rotate(4deg) translate(4px, 2px); opacity: .75; }

    notion:{n:"Notion",s:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8.5 16V9l7 7V9" stroke-linecap="round" stroke-linejoin="round"/></svg>'},

    unity:{n:"Unity",s:'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l6 3.4v7.2L12 21l-6-7.4V6.4L12 3zm0 2.6L8 8v6l4 2.4L16 14V8l-4-2.4z" opacity=".9"/></svg>'},

  };
  function toolsHtml(list, lang){
    var arr2 = Array.isArray(list) ? list : [];
    if (!arr2.length) return '';
    return '<div class="tool-grid">' + arr2.map(function(key){
      var it = TOOL_ICONS[key]; if (!it) return '';
      return '<span class="tool" title="' + esc(it.n) + '"><span class="tool__ic">' + it.s + '</span><span class="tool__nm">' + esc(it.n) + '</span></span>';
    }).join('') + '</div>';
  }

  var PAGES = ['home','resume','cover','projects','play'];
  var HREF = { home:'#home', resume:'#resume', cover:'#cover', projects:'#projects', play:'#play' };

  /* ---------- 공통 조각 ---------- */
  function navHtml(c, lang, base, active) {
    var links = PAGES.map(function (k) {
      var isActive = (k === active) || (active === 'detail' && k === 'projects');
      return '<li><a class="nav__link' + (isActive ? ' is-active' : '') + '" href="' + esc(base + HREF[k]) + '">' +
        '<span>' + esc(t(c.nav[k], lang)) + '</span>' + CHEV + '</a></li>';
    }).join('');
    return '<a class="nav__logo" href="' + esc(base + HREF.home) + '">' + GHOST +
        '<span>' + esc(t(c.meta.name, lang)) + '</span>' +
        '<span class="nav__logo-en">' + esc(t(c.meta.role, lang)) + '</span></a>' +
      '<ul class="nav__menu">' + links + '</ul>' +
      '<div class="nav__actions">' +
        '<div class="lang-toggle" role="group" aria-label="언어 / Language">' +
          '<button type="button" class="lang-toggle__btn" data-lang-btn="ko" aria-pressed="' + (lang==='ko') + '">KR</button>' +
          '<button type="button" class="lang-toggle__btn" data-lang-btn="en" aria-pressed="' + (lang==='en') + '">EN</button>' +
        '</div>' +
        '<button type="button" class="icon-btn" data-theme-toggle aria-label="' + (lang==='en'?'Toggle dark mode':'다크모드 전환') + '"><span data-theme-icon></span></button>' +
        '<a class="btn btn--primary btn--sm nav__cta" href="' + esc(base + c.meta.resumeUrl) + '">' + (lang==='en'?'Résumé':'이력서') + '</a>' +
        '<button type="button" class="nav__burger" data-menu-toggle aria-expanded="false" aria-controls="mobile-menu" aria-label="' + (lang==='en'?'Open menu':'메뉴 열기') + '"><span class="nav__burger-lines" aria-hidden="true"></span></button>' +
      '</div>';
  }
  function sheetHtml(c, lang, base, active) {
    var links = PAGES.map(function (k, i) {
      var isActive = (k === active) || (active === 'detail' && k === 'projects');
      return '<a class="sheet__link' + (isActive ? ' is-active' : '') + '" href="' + esc(base + HREF[k]) + '">' +
        '<span class="sheet__num">' + ('0'+(i+1)) + '</span><span>' + esc(t(c.nav[k], lang)) + '</span></a>';
    }).join('');
    return links + '<div class="sheet__foot"><a class="btn btn--primary" href="' + esc(base + c.meta.resumeUrl) + '">' +
      (lang==='en'?'Download résumé (PDF)':'이력서 다운로드 (PDF)') + '</a></div>';
  }
  function footerHtml(c, lang, base) {
    var mail = (c.meta.email||'').trim(), gh = (c.meta.github||'').trim();
    var links = '<a class="btn btn--outline btn--sm" href="' + esc(base + c.meta.resumeUrl) + '">' + (lang==='en'?'Résumé (PDF)':'이력서 (PDF)') + '</a>' +
      (mail ? '<a class="btn btn--outline btn--sm" href="mailto:' + esc(mail) + '">' + (lang==='en'?'Email':'이메일') + '</a>'
            : '<span class="btn btn--outline btn--sm is-placeholder">' + (lang==='en'?'Email — TBA':'이메일 — 입력 예정') + '</span>') +
      (gh ? '<a class="btn btn--outline btn--sm" href="' + esc(gh) + '" target="_blank" rel="noopener noreferrer">GitHub</a>' : '');
    return '<div class="footer__inner">' +
      '<div><div class="footer__brand">' + GHOST + '<span>' + esc(t(c.meta.name, lang)) + ' · ' + esc(t(c.meta.role, lang)) + '</span></div>' +
        '<p class="footer__tagline">' + esc(t(c.footer && c.footer.tagline, lang)) + '</p></div>' +
      '<div class="footer__links">' + links + '</div>' +
      '</div><p class="footer__copy">© ' + new Date().getFullYear() + ' ' + esc(t(c.meta.name, lang)) + '</p>';
  }

  function tagsHtml(tags, lang, style) {
    if (!arr(tags).length) return '';
    return '<div class="tags"' + (style?' style="'+style+'"':'') + '>' + arr(tags).map(function (tag) {
      var text = tag.text !== undefined ? tag.text : tag;
      return '<span class="tag' + toneClass(tag.tone) + '">' + esc(t(text, lang)) + '</span>';
    }).join('') + '</div>';
  }
  function statsHtml(stats, lang) {
    return arr(stats).map(function (s) {
      var u = t(s.unit, lang);
      return '<div class="stat reveal"><p class="stat__num">' + esc(s.num) + (u?'<span class="unit">'+esc(u)+'</span>':'') + '</p>' +
        '<p class="stat__label">' + esc(t(s.label, lang)) + '</p></div>';
    }).join('');
  }
  function paragraphs(field, lang, cls) {
    var todo = lang==='en' ? 'To be written.' : '작성 예정.';
    if (!has(field, lang)) return '<p class="' + (cls||'muted') + '">' + todo + '</p>';
    return t(field, lang).split(/\n{2,}|\n/).filter(function (s){return s.trim();}).map(function (s){return '<p>' + s + '</p>';}).join('');
  }

  /* ---------- HOME ---------- */
  function renderHome(c, lang, base) {
    var h = c.home || {};
    var hero =
      '<section class="hero"><div class="wrap"><div class="hero__grid">' +
        '<div><p class="hero__eyebrow">' + GHOST + '<span>' + esc(t(c.meta.role, lang)) + ' · Portfolio</span></p>' +
          '<h1 class="hero__title">' + t(c.hero.titleHtml, lang) + '</h1>' +
          '<p class="hero__sub">' + esc(t(h.sub, lang)) + '</p>' +
          '<div class="btn-row">' +
            '<a class="btn btn--primary" href="' + esc(base+HREF.resume) + '">' + esc(t(h.ctaResume, lang)) + '</a>' +
            '<a class="btn btn--outline" href="' + esc(base+HREF.projects) + '">' + esc(t(h.ctaProjects, lang)) + '</a>' +
          '</div></div>' +
        '<div class="hero__media"><div class="ghost-art" aria-hidden="true">' + GHOST.replace('class="ghost"','class="ghost ghost--float"') + '</div></div>' +
      '</div></div></section>';

    var draw = c.home && c.home.draw || {};
    var drawSec =
      '<section class="draw"><div class="wrap"><div class="draw__stage">' +
        '<button type="button" class="draw__deck" data-draw aria-label="' + esc(t(draw.label, lang) || '프로젝트 뽑기') + '">' +
          '<span class="draw__deck-card" aria-hidden="true"></span>' +
          '<span class="draw__deck-card" aria-hidden="true"></span>' +
          '<span class="draw__deck-card"><span class="draw__deck-face">' + GHOST +
            '<span class="draw__deck-label">' + esc(t(draw.label, lang) || '프로젝트 뽑기') + '</span>' +
            '<span class="draw__deck-hint">' + esc(t(draw.hint, lang)) + '</span></span></span>' +
        '</button>' +
        '<div class="draw__cards" data-draw-cards></div>' +
      '</div></div></section>';

    return '<div class="home-screen">' + hero + drawSec + '</div>';
  }

  // 카드 뽑기 결과 카드 (main.js 에서 호출)
  function drawCardHtml(c, lang, base, p, delay) {
    var cat = c.projects && c.projects.tabs && c.projects.tabs[p.category];
    return '<a class="draw-card" href="' + esc('#project=' + encodeURIComponent(p.id)) + '" style="--d:' + (delay||0) + 'ms">' +
      '<span class="draw-card__inner">' +
        '<span class="draw-card__back" aria-hidden="true">' + GHOST + '</span>' +
        '<span class="draw-card__front">' +
          '<span class="draw-card__cat">' + esc(cat ? t(cat, lang) : '') + '</span>' +
          '<span class="draw-card__title">' + esc(t(p.title, lang)) + '</span>' +
          '<span class="draw-card__sub">' + esc(t(p.sub, lang)) + '</span>' +
          '<span class="draw-card__go">' + (lang==='en'?'Open →':'열기 →') + '</span>' +
        '</span>' +
      '</span></a>';
  }

  /* ---------- RESUME ---------- */
  function renderResume(c, lang, base) {
    var r = c.resume || {};
    var hero =
      '<section class="hero"><div class="wrap"><div class="hero__grid">' +
        '<div><p class="hero__eyebrow">' + (lang==='en'?'RÉSUMÉ':'이력서') + '</p>' +
          '<h1 class="hero__title">' + t(c.hero.titleHtml, lang) + '</h1>' +
          '<p class="hero__note"><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M7 2v9M3 7.2 7 11l4-3.8" stroke-linecap="round" stroke-linejoin="round"/></svg>' + esc(t(r.heroNote, lang)) + '</p></div>' +
        '<div class="hero__media"><div class="ghost-art" aria-hidden="true">' + GHOST.replace('class="ghost"','class="ghost ghost--float"') + '</div></div>' +
      '</div></div></section>';

    var stats = arr(r.stats).length ? '<section class="section section--elev"><div class="wrap"><div class="stat-grid">' + statsHtml(r.stats, lang) + '</div></div></section>' : '';

    var sk = r.skills || {};
    var skillCards = arr(sk.cards).map(function (card) {
      return '<article class="card skill-card reveal"><h3 class="card__title">' + esc(t(card.title, lang)) + '</h3>' +
        '<p class="card__body">' + esc(t(card.body, lang)) + '</p>' + toolsHtml(card.tools, lang) + '</article>';
    }).join('');
    var skills = '<section class="section"><div class="wrap"><header class="section__head reveal">' +
      '<p class="eyebrow">' + (lang==='en'?'CORE SKILLS':'핵심역량') + '</p>' +
      '<h2 class="section__title">' + esc(t(sk.title, lang)) + '</h2>' +
      '<p class="section__lead">' + esc(t(sk.lead, lang)) + '</p></header>' +
      '<div class="grid grid--3">' + skillCards + '</div></div></section>';

    var ca = r.career || {};
    var careerItems = arr(ca.items).map(function (it) {
      return '<li class="tl-item' + (it.now?' tl-item--now':'') + ' reveal">' +
        '<p class="tl-date">' + esc(t(it.date, lang)) + '</p>' +
        '<h3 class="tl-role">' + esc(t(it.role, lang)) + '</h3>' +
        '<p class="tl-org">' + esc(t(it.org, lang)) + '</p>' +
        '<p class="tl-body">' + esc(t(it.body, lang)) + '</p>' +
        tagsHtml(it.tags, lang).replace('class="tags"','class="tags tl-tags"') + '</li>';
    }).join('');
    var career = '<section class="section section--elev"><div class="wrap"><header class="section__head reveal">' +
      '<p class="eyebrow">' + (lang==='en'?'CAREER':'경력') + '</p>' +
      '<h2 class="section__title">' + esc(t(ca.title, lang)) + '</h2>' +
      '<p class="section__lead">' + esc(t(ca.lead, lang)) + '</p></header>' +
      '<ol class="timeline">' + careerItems + '</ol></div></section>';

    return hero + stats + skills + career;
  }

  /* ---------- COVER LETTER ---------- */
  function renderCover(c, lang, base) {
    var cl = c.coverLetter || {};
    var blocks = arr(cl.blocks);
    var body;
    if (!blocks.length) {
      body = '<div class="cover-empty">' + GHOST + '<p>' + esc(t(cl.lead, lang) || (lang==='en'?'Coming soon.':'곧 채울 예정입니다.')) + '</p></div>';
    } else {
      body = blocks.map(function (b) {
        return '<div class="cover-block reveal">' + (has(b.heading, lang) ? '<h3>' + esc(t(b.heading, lang)) + '</h3>' : '') + paragraphs(b.body, lang) + '</div>';
      }).join('');
    }
    return '<section class="section"><div class="wrap"><header class="section__head reveal">' +
      '<p class="eyebrow">' + (lang==='en'?'ABOUT ME':'자기소개서') + '</p>' +
      '<h2 class="section__title">' + esc(t(cl.title, lang)) + '</h2></header>' + body + '</div></section>';
  }

  /* ---------- PROJECTS ---------- */
  function renderProjects(c, lang, base) {
    var pr = c.projects || {};
    var tabs = pr.tabs || {};
    var tabsHtmlStr = ['all','game','planning'].filter(function (k){return tabs[k];}).map(function (k, i) {
      return '<button type="button" class="tab' + (i===0?' is-active':'') + '" data-proj-tab="' + k + '">' + esc(t(tabs[k], lang)) + '</button>';
    }).join('');
    var head = '<div class="proj-head reveal"><h1 class="proj-title">' + esc(t(pr.title, lang)) + '</h1>' +
      '<div class="tabs" role="tablist">' + tabsHtmlStr + '</div></div>';
    var grid = '<div class="proj-grid" data-proj-grid>' + arr(pr.items).map(function (p) { return projCardHtml(c, lang, base, p); }).join('') + '</div>';
    return '<section class="section"><div class="wrap">' + head + grid +
      '<div class="proj-empty" data-proj-empty hidden>' + (lang==='en'?'No projects in this category yet.':'이 분류에는 아직 프로젝트가 없습니다.') + '</div>' +
      '</div></section>';
  }
  function projCardHtml(c, lang, base, p) {
    var cat = c.projects.tabs && c.projects.tabs[p.category];
    return '<a class="proj-card reveal" data-cat="' + esc(p.category||'') + '" href="' + esc('#project=' + encodeURIComponent(p.id)) + '">' +
      '<span class="proj-card__cat">' + esc(cat ? t(cat, lang) : '') + '</span>' +
      '<span class="proj-card__title">' + esc(t(p.title, lang)) + '</span>' +
      '<span class="proj-card__sub">' + esc(t(p.sub, lang)) + '</span>' +
      '<span class="proj-card__period">' + esc(t(p.period, lang)) + '</span></a>';
  }

  /* ---------- PROJECT DETAIL ---------- */
  function renderDetail(c, lang, base, id) {
    var items = arr(c.projects && c.projects.items);
    var idx = -1; items.forEach(function (p,i){ if (p.id===id) idx=i; });
    if (idx < 0) {
      return '<section class="section"><div class="wrap"><a class="back-link" href="' + esc('#projects') + '"><span>' + (lang==='en'?'← Projects':'← 프로젝트') + '</span></a>' +
        '<h1 class="section__title">' + (lang==='en'?'Project not found':'프로젝트를 찾을 수 없습니다') + '</h1></div></section>';
    }
    var p = items[idx];
    var m = p.media || {};
    var media;
    if ((m.embed||'').trim()) {
      media = '<div class="media-box media-box--embed"><iframe src="' + esc(m.embed) + '" title="' + esc(t(p.title, lang)) + '" loading="lazy" allowfullscreen referrerpolicy="no-referrer"></iframe></div>';
    } else {
      media = '<div class="media-box media-box--empty">' + esc(t(m.note, lang) || (lang==='en'?'Space for gameplay video and images.':'게임 영상·이미지가 들어갈 자리입니다.')) + '</div>';
    }
    var genres = arr(p.genres).slice(0,3);
    var learned = arr(p.learned);
    var links = p.links || {};
    var stores = '<div class="detail__stores">' +
      '<a class="store-link" ' + ((links.googlePlay||'').trim() ? 'href="'+esc(links.googlePlay)+'" target="_blank" rel="noopener noreferrer"' : 'aria-disabled="true" href="#"') + ' aria-label="Google Play">' + PLAY_ICON + '</a>' +
      '<a class="store-link" ' + ((links.steam||'').trim() ? 'href="'+esc(links.steam)+'" target="_blank" rel="noopener noreferrer"' : 'aria-disabled="true" href="#"') + ' aria-label="Steam">' + STEAM_ICON + '</a>' +
      '</div>';

    var info = '<div class="detail__info">' +
      '<a class="back-link" href="' + esc('#projects') + '"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2 3.5 6l4 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>' + (lang==='en'?'Projects':'프로젝트 목록') + '</span></a>' +
      '<h1 class="detail__title">' + esc(t(p.title, lang)) + '</h1>' +
      '<p class="detail__period">' + esc(t(p.period, lang)) + '</p>' +
      (genres.length ? '<div class="detail__genres">' + tagsHtml(genres.map(function(g){return {text:g,tone:'lavender'};}), lang) + '</div>' : '') +
      '<div class="detail__meta">' +
        metaRow(lang==='en'?'Headcount':'인원', t(p.headcount, lang)) +
        metaRow(lang==='en'?'My role':'맡은 역할', t(p.myRole, lang)) +
        metaRow(lang==='en'?'Status':'상태', t(p.status, lang)) +
      '</div>' +
      (learned.length ? '<div class="detail__learned"><p class="detail__learned-title">' + (lang==='en'?'What I learned':'무엇을 배웠는지') + '</p><ul class="bullets">' + learned.map(function (b){return '<li>' + t(b, lang) + '</li>';}).join('') + '</ul></div>' : '') +
      stores + '</div>';

    var mediaCol = '<div class="detail__media">' + media + '</div>';

    // 선택 상세 블록 (있을 때만)
    var d = p.detailBlocks || {};
    var blocks = '';
    if (has(d.problem, lang) || has(d.approach, lang) || has(d.retrospective, lang)) {
      blocks = '<div class="detail__blocks">' +
        block(lang, '문제', 'The problem', 'PROBLEM', d.problem) +
        block(lang, '접근', 'The approach', 'APPROACH', d.approach) +
        block(lang, '다시 한다면', 'Retrospective', 'RETROSPECTIVE', d.retrospective) +
      '</div>';
    }

    var prev = idx>0 ? items[idx-1] : null, next = idx<items.length-1 ? items[idx+1] : null;
    var pager = '<nav class="pager" aria-label="프로젝트 이동">' +
      (prev ? pagerItem('#project='+encodeURIComponent(prev.id), lang==='en'?'← Previous':'← 이전', t(prev.title, lang)) : pagerItem('#projects', lang==='en'?'← Projects':'← 목록', lang==='en'?'All projects':'전체 보기')) +
      (next ? pagerItem('#project='+encodeURIComponent(next.id), lang==='en'?'Next →':'다음 →', t(next.title, lang), 1) : pagerItem('#play', lang==='en'?'Play log →':'게임플레이 →', t(c.play&&c.play.title, lang), 1)) +
    '</nav>';

    return '<section class="section"><div class="wrap"><div class="detail">' + info + mediaCol + '</div>' + blocks + pager + '</div></section>';
  }
  function metaRow(k, v) {
    if (!v) return '';
    return '<div class="detail__meta-row"><p class="detail__meta-k">' + esc(k) + '</p><p class="detail__meta-v">' + esc(v) + '</p></div>';
  }
  function block(lang, ko, en, small, field) {
    var todo = lang==='en'?'To be written.':'작성 예정.';
    var body = has(field, lang) ? t(field, lang).split(/\n{2,}|\n/).filter(function(s){return s.trim();}).map(function(s){return '<p>'+s+'</p>';}).join('') : '<p class="muted">'+todo+'</p>';
    return '<div class="block reveal"><div class="block__label">' + (lang==='en'?en:ko) + '<small>' + small + '</small></div><div class="block__body">' + body + '</div></div>';
  }
  function pagerItem(href, dir, title, right) {
    return '<a class="pager__item" href="' + esc(href) + '"' + (right?' style="text-align:right"':'') + '><p class="pager__dir">' + dir + '</p><p class="pager__title">' + esc(title) + '</p></a>';
  }

  /* ---------- PLAY ---------- */
  function renderPlay(c, lang, base) {
    var pl = c.play || {};
    var cards = arr(pl.cards).map(function (card) {
      return '<article class="play-card reveal"><div class="play-card__top"><h3 class="play-card__name">' + esc(t(card.name, lang)) + '</h3>' +
        '<span class="play-card__hours">' + esc(t(card.hours, lang)) + '</span></div>' +
        '<p class="play-card__genre">' + esc(t(card.genre, lang)) + '</p>' +
        '<p class="play-card__note">' + esc(t(card.note, lang)) + '</p></article>';
    }).join('');
    return '<section class="section"><div class="wrap"><header class="section__head reveal">' +
      '<p class="eyebrow">' + (lang==='en'?'PLAY LOG':'게임플레이') + '</p>' +
      '<h2 class="section__title">' + esc(t(pl.title, lang)) + '</h2>' +
      '<p class="section__lead">' + esc(t(pl.lead, lang)) + '</p></header>' +
      '<div class="play">' + cards + '</div></div></section>';
  }

  global.PortfolioRender = {
    t: t, esc: esc, HREF: HREF,
    navHtml: navHtml, sheetHtml: sheetHtml, footerHtml: footerHtml,
    renderHome: renderHome, renderResume: renderResume, renderCover: renderCover,
    renderProjects: renderProjects, renderDetail: renderDetail, renderPlay: renderPlay,
    drawCardHtml: drawCardHtml
  };
})(window);

/* ===== main ===== */
/* ============================================================================
   main.js — 페이지 조립과 동작
   내용은 assets/content.js · 화면 구성은 assets/js/render.js
   ========================================================================== */
(function () {
  'use strict';
  var R = window.PortfolioRender;
  var LANG_KEY = 'portfolio:lang', THEME_KEY = 'portfolio:theme', DRAFT_KEY = 'portfolio:draft';

  document.documentElement.classList.remove('no-js');
  var $  = function (s,c){ return (c||document).querySelector(s); };
  var $$ = function (s,c){ return Array.prototype.slice.call((c||document).querySelectorAll(s)); };

  /* ---------- 내용 (편집기 미리보기 지원) ---------- */
  function loadContent() {
    var params = new URLSearchParams(location.search);
    if (params.get('preview') === '1') {
      try { var raw = localStorage.getItem(DRAFT_KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    }
    return window.PORTFOLIO_CONTENT;
  }
  var content = loadContent();
  if (!content || !R) {
    document.body.innerHTML = '<p style="padding:40px;font:16px system-ui">content.js / render.js 를 불러오지 못했습니다.</p>';
    return;
  }

  var base = '';
  var lang = readLang();
  var page = 'home';
  var projectId = '';
  function parseRoute() {
    var h = (location.hash || '').replace(/^#/, '');
    if (h.indexOf('project=') === 0) { page = 'detail'; projectId = decodeURIComponent(h.slice(8)); }
    else { page = ['home','resume','cover','projects','play'].indexOf(h) >= 0 ? h : 'home'; projectId = ''; }
  }
  parseRoute();

  function readLang(){ try{ var v=localStorage.getItem(LANG_KEY); if(v==='ko'||v==='en') return v; }catch(e){} return 'ko'; }
  function saveLang(v){ try{ localStorage.setItem(LANG_KEY,v); }catch(e){} }

  /* ---------- 테마 ---------- */
  function currentTheme(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function applyThemeIcon(){
    var span = $('[data-theme-icon]');
    if (!span) return;
    // 다크면 해(밝게 전환), 라이트면 달(어둡게 전환)
    span.innerHTML = currentTheme()==='dark'
      ? '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="4"/><path d="M10 1v2M10 17v2M1 10h2M17 10h2M3.5 3.5l1.4 1.4M15.1 15.1l1.4 1.4M16.5 3.5l-1.4 1.4M4.9 15.1l-1.4 1.4" stroke-linecap="round"/></svg>'
      : '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M16 11.5A6.5 6.5 0 0 1 8.5 4a6.5 6.5 0 1 0 7.5 7.5z" stroke-linejoin="round"/></svg>';
  }
  function toggleTheme(){
    var next = currentTheme()==='dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch(e){}
    applyThemeIcon();
    var meta = $('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', next==='dark' ? '#16121f' : '#fdfcfe');
  }

  /* ---------- 렌더 ---------- */
  function render() {
    parseRoute();
    document.body.setAttribute('data-page', page);
    var slots = { nav:'[data-slot="nav"]', sheet:'[data-slot="sheet"]', main:'[data-slot="main"]', footer:'[data-slot="footer"]' };
    var navEl = $(slots.nav), sheetEl = $(slots.sheet), mainEl = $(slots.main), footEl = $(slots.footer);
    if (navEl)  navEl.innerHTML  = R.navHtml(content, lang, base, page);
    if (sheetEl) sheetEl.innerHTML = R.sheetHtml(content, lang, base, page);
    if (footEl) footEl.innerHTML = R.footerHtml(content, lang, base);
    if (mainEl) {
      mainEl.innerHTML =
        page==='home'     ? R.renderHome(content, lang, base) :
        page==='resume'   ? R.renderResume(content, lang, base) :
        page==='cover'    ? R.renderCover(content, lang, base) :
        page==='projects' ? R.renderProjects(content, lang, base) :
        page==='detail'   ? R.renderDetail(content, lang, base, projectId) :
        page==='play'     ? R.renderPlay(content, lang, base) : '';
    }
    document.documentElement.setAttribute('lang', lang);
    applyThemeIcon();
    updateTitle();
    initObservers();
    initProjTabs();
    initDraw();
    // 언어 바뀌면 이미 뽑아둔 카드도 다시 그림
    if (drawnIds) dealCards(drawnIds);
  }

  function updateTitle() {
    var name = R.t(content.meta.name, lang);
    var map = {
      home:   R.t(content.meta.role, lang) + ' 포트폴리오',
      resume: R.t(content.nav.resume, lang),
      cover:  R.t(content.nav.cover, lang),
      projects: R.t(content.nav.projects, lang),
      play:   R.t(content.nav.play, lang)
    };
    var title;
    if (page==='detail') {
      var items = (content.projects && content.projects.items) || [];
      var p = items.filter(function(x){return x.id===projectId;})[0];
      title = (p ? R.t(p.title, lang) : R.t(content.nav.projects, lang)) + ' · ' + name;
    } else {
      title = name + ' · ' + (map[page] || '');
    }
    document.title = title;
  }

  /* ---------- 접이식 헤더 ---------- */
  function initHeader() {
    // 헤더는 항상 펼쳐진 상태 — 접힘 동작 제거.
    var handle = $('[data-nav-handle]');
    if (handle) handle.remove();
  }

  /* ---------- 카드 뽑기 ---------- */
  var drawnIds = null;
  function pickRandom(n) {
    var items = (content.projects && content.projects.items) || [];
    var pool = items.slice();
    for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random()*(i+1)); var t=pool[i]; pool[i]=pool[j]; pool[j]=t; }
    return pool.slice(0, Math.min(n, pool.length)).map(function(p){ return p.id; });
  }
  function dealCards(ids) {
    var box = $('[data-draw-cards]');
    if (!box) return;
    var items = (content.projects && content.projects.items) || [];
    var byId = {}; items.forEach(function(p){ byId[p.id]=p; });
    var cards = ids.map(function(id){ return byId[id]; }).filter(Boolean);
    if (!cards.length) {
      box.innerHTML = '<div class="draw__empty">' + (lang==='en'?'Add projects in the editor to draw them here.':'편집기에서 프로젝트를 추가하면 여기에 나옵니다.') + '</div>';
      return;
    }
    box.innerHTML = cards.map(function(p, i){ return R.drawCardHtml(content, lang, base, p, i*90); }).join('');
  }
  function initDraw() {
    var deck = $('[data-draw]');
    if (!deck) return;
    var cfg = (content.home && content.home.draw) || {};
    var count = cfg.count || 4;
    // 첫 화면에서 한 벌이 이미 펼쳐져 있도록 자동으로 한 번 뽑아 둔다
    if (!drawnIds) { drawnIds = pickRandom(count); dealCards(drawnIds); }
    deck.addEventListener('click', function () {
      deck.classList.remove('is-draw');
      void deck.offsetWidth;          // 리플로우로 애니메이션 재시작
      deck.classList.add('is-draw');
      drawnIds = pickRandom(count);
      dealCards(drawnIds);
    });
  }

  /* ---------- 프로젝트 탭 ---------- */
  function initProjTabs() {
    var tabs = $$('[data-proj-tab]');
    if (!tabs.length) return;
    var grid = $('[data-proj-grid]'), empty = $('[data-proj-empty]');
    function apply(cat) {
      var shown = 0;
      $$('.proj-card', grid).forEach(function (card) {
        var ok = cat==='all' || card.getAttribute('data-cat')===cat;
        card.hidden = !ok;
        if (ok) shown++;
      });
      if (empty) empty.hidden = shown > 0;
    }
    tabs.forEach(function (tab) {
      tab.addEventListener('click', function () {
        tabs.forEach(function(t){ t.classList.toggle('is-active', t===tab); });
        apply(tab.getAttribute('data-proj-tab'));
      });
    });
  }

  /* ---------- 관찰자 (리빌) ---------- */
  var revObs = null;
  function initObservers() {
    if (revObs) revObs.disconnect();
    var els = $$('.reveal');
    if ('IntersectionObserver' in window && els.length) {
      revObs = new IntersectionObserver(function (entries) {
        entries.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-visible'); revObs.unobserve(e.target); } });
      }, { rootMargin:'0px 0px -8% 0px', threshold:0.08 });
      els.forEach(function (el){ revObs.observe(el); });
    } else { els.forEach(function (el){ el.classList.add('is-visible'); }); }
  }

  /* ---------- 모바일 메뉴 ---------- */
  var sheet = null, scrollY = 0;
  function setMenu(open) {
    sheet = sheet || $('[data-menu]');
    if (!sheet) return;
    sheet.classList.toggle('is-open', open);
    sheet.setAttribute('aria-hidden', String(!open));
    var burger = $('[data-menu-toggle]');
    if (burger) burger.setAttribute('aria-expanded', String(open));
    if (open) {
      scrollY = window.pageYOffset || document.documentElement.scrollTop;
      document.body.style.top = (-scrollY)+'px'; document.body.style.position='fixed'; document.body.style.width='100%';
      document.body.classList.add('is-locked');
    } else {
      document.body.classList.remove('is-locked');
      document.body.style.position=''; document.body.style.top=''; document.body.style.width='';
      window.scrollTo(0, scrollY);
    }
  }

  /* ---------- 부드러운 스크롤 폴백 ---------- */
  var supportsSmooth = 'scrollBehavior' in document.documentElement.style;
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function animateTo(top) {
    var start = window.pageYOffset, delta = top - start, dur = Math.min(700, Math.max(300, Math.abs(delta)*0.4)), t0 = null;
    function step(now){ if(t0===null)t0=now; var p=Math.min(1,(now-t0)/dur); var e=p<0.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2; window.scrollTo(0,start+delta*e); if(p<1)requestAnimationFrame(step); }
    requestAnimationFrame(step);
  }
  function scrollToTop(top){ if(reduced)window.scrollTo(0,top); else if(supportsSmooth)window.scrollTo({top:top,behavior:'smooth'}); else animateTo(top); }
  function navOffset(){ var n=$('.nav'); return (n?n.getBoundingClientRect().height:60)+24; }

  /* ---------- 이벤트 위임 ---------- */
  document.addEventListener('click', function (e) {
    var langBtn = e.target.closest('[data-lang-btn]');
    if (langBtn) { lang = langBtn.getAttribute('data-lang-btn')==='en'?'en':'ko'; saveLang(lang); var y=window.pageYOffset; render(); window.scrollTo(0,y); return; }
    if (e.target.closest('[data-theme-toggle]')) { toggleTheme(); return; }
    if (e.target.closest('[data-menu-toggle]')) { sheet = sheet || $('[data-menu]'); setMenu(!sheet.classList.contains('is-open')); return; }
    if (e.target.closest('[data-to-top]')) { scrollToTop(0); return; }
    sheet = sheet || $('[data-menu]');
    if (sheet && sheet.classList.contains('is-open') && e.target === sheet) { setMenu(false); return; }
    var link = e.target.closest('a[href^="#"]');
    if (link) { sheet = sheet || $('[data-menu]'); if (sheet && sheet.classList.contains('is-open')) setMenu(false); return; }
  });
  document.addEventListener('keydown', function (e){ if(e.key==='Escape'){ sheet=sheet||$('[data-menu]'); if(sheet&&sheet.classList.contains('is-open'))setMenu(false); } });
  window.addEventListener('resize', function (){ sheet=sheet||$('[data-menu]'); if(window.innerWidth>=1000&&sheet&&sheet.classList.contains('is-open'))setMenu(false); });

  /* ---------- 맨 위로 ---------- */
  function initToTop() {
    var btn = $('[data-to-top]'); if (!btn) return;
    var ticking = false;
    var onScroll = function(){ if(ticking)return; ticking=true; requestAnimationFrame(function(){ btn.classList.toggle('is-shown', window.pageYOffset>window.innerHeight*0.9); ticking=false; }); };
    window.addEventListener('scroll', onScroll, {passive:true}); onScroll();
  }

  /* ---------- 시작 ---------- */
  render();
  initHeader();
  initToTop();
  window.addEventListener('hashchange', function () {
    sheet = sheet || $('[data-menu]');
    if (sheet && sheet.classList.contains('is-open')) setMenu(false);
    render();
    window.scrollTo(0, 0);
  });

  if (new URLSearchParams(location.search).get('preview')==='1') {
    var b = document.createElement('div'); b.className='preview-banner';
    b.innerHTML = (lang==='en'?'Editor preview — unsaved. ':'편집기 미리보기 — 저장 안 됨. ') + '<a href="'+base+'edit.html">'+(lang==='en'?'Back to editor':'편집기로')+'</a>';
    document.body.appendChild(b);
  }
})();

</script>
